<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lunar Lander - Single File Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
    }

    #gameContainer {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    canvas {
      border: 2px solid #555;
      background: radial-gradient(circle at 50% 20%, #222 0, #02020a 60%);
      display: block;
    }

    #hud {
      display: flex;
      gap: 16px;
      font-size: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #messages {
      font-size: 14px;
      text-align: center;
      min-height: 1.5em;
      color: #ffd27f;
    }

    .label {
      color: #aaa;
    }

    .value {
      color: #fff;
      font-weight: 600;
    }

    #instructions {
      font-size: 12px;
      color: #bbb;
      text-align: center;
      max-width: 800px;
      margin-top: 4px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="hud">
      <div><span class="label">Level:</span> <span id="level" class="value"></span></div>
      <div><span class="label">Fuel:</span> <span id="fuel" class="value"></span></div>
      <div><span class="label">Vertical Speed:</span> <span id="vSpeed" class="value"></span></div>
      <div><span class="label">Horizontal Speed:</span> <span id="hSpeed" class="value"></span></div>
      <div><span class="label">Angle:</span> <span id="angle" class="value"></span></div>
      <div><span class="label">Score:</span> <span id="score" class="value"></span></div>
    </div>
    <div id="messages"></div>
    <div id="instructions">
      Controls: 
      <strong>Up Arrow</strong> = Thrust, 
      <strong>Left / Right Arrows</strong> = Tilt, 
      <strong>S</strong> = Start,
      <strong>N</strong> = Next Level,
      <strong>R</strong> = Retry level / Restart. Landing pads are flat, highlighted sections of the surface.
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      const fuelEl = document.getElementById('fuel');
      const vSpeedEl = document.getElementById('vSpeed');
      const hSpeedEl = document.getElementById('hSpeed');
      const angleEl = document.getElementById('angle');
      const scoreEl = document.getElementById('score');
      const levelEl = document.getElementById('level');
      const msgEl = document.getElementById('messages');

      // Physics constants
      let GRAVITY = 0.03;         // downward acceleration (modified by level)
      const THRUST = 0.08;        // engine thrust
      const ROTATE_SPEED = 0.04;  // radians per frame while holding left/right

      const SAFE_ANGLE = 0.25;    // radians from vertical
      const SAFE_VSPEED = 1.2;    // safe vertical speed threshold
      const SAFE_HSPEED = 1.0;    // safe horizontal speed threshold

      // Ship parameters
      const SHIP_WIDTH = 16;
      const SHIP_HEIGHT = 24;

      let keys = {
        left: false,
        right: false,
        thrust: false
      };

      let terrainPoints = [];
      let landingPads = [];

      let ship;
      let gameStarted = false;
      let gameOver = false;
      let totalScore = 0;
      let currentLevel = 1;
      const MAX_LEVEL = 20;

      function createTerrain() {
        terrainPoints = [];
        landingPads = [];
        
        let difficultyRatio = (currentLevel - 1) / (MAX_LEVEL - 1); // 0.0 to 1.0

        // Scale widths down as level increases
        const width50 = Math.max(50, 180 - (difficultyRatio * 100)); // 180 down to 80
        const width100 = Math.max(30, 100 - (difficultyRatio * 60)); // 100 down to 40
        const width200 = Math.max(15, 60 - (difficultyRatio * 40));  // 60 down to 20
        
        const padConfigs = [
          { width: width50, points: 50, label: '50' },
          { width: width100, points: 100, label: '100' },
          { width: width200, points: 200, label: '200' }
        ];
        
        // Shuffle pads to place them randomly across left, middle, right zones
        for (let i = padConfigs.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [padConfigs[i], padConfigs[j]] = [padConfigs[j], padConfigs[i]];
        }
        
        // Divide width into 3 zones to ensure pads are spread out
        const zones = [
          { minX: 40, maxX: 220 },
          { minX: 300, maxX: 480 },
          { minX: 560, maxX: 740 }
        ];
        
        const pads = [];
        for (let i = 0; i < 3; i++) {
          const config = padConfigs[i];
          const zone = zones[i];
          const maxStartX = zone.maxX - config.width;
          const startX = zone.minX + Math.random() * (maxStartX - zone.minX);
          const y = 350 + Math.random() * 150; // Random height lower in screen
          
          pads.push({
            startX: startX,
            endX: startX + config.width,
            y: y,
            points: config.points,
            label: config.label
          });
        }
        
        let currentX = 0;
        let currentY = 250 + Math.random() * 200;
        terrainPoints.push({ x: currentX, y: currentY });
        
        let padIndex = 0;
        
        while (currentX < W) {
          let stepX = 15 + Math.random() * 25;
          let nextX = currentX + stepX;
          
          if (padIndex < pads.length && nextX >= pads[padIndex].startX) {
            const pad = pads[padIndex];
            
            // Add a jagged cliff right before the pad to connect roughly
            let prePadX = pad.startX - (Math.random() * 10 + 5);
            if (prePadX > currentX) {
                let cliffY = currentY + (Math.random() - 0.5) * 150;
                cliffY = Math.max(150, Math.min(550, cliffY));
                terrainPoints.push({ x: prePadX, y: cliffY });
            }
            
            // Flat pad surface
            terrainPoints.push({ x: pad.startX, y: pad.y });
            terrainPoints.push({ x: pad.endX, y: pad.y });
            
            currentX = pad.endX;
            currentY = pad.y;
            landingPads.push(pad);
            padIndex++;
          } else {
            if (nextX >= W) {
              nextX = W;
            }
            
            // Jagged mountain generation based on difficulty
            // Level 1: almost flat (variance ~30), Level 20: very jagged (variance ~250)
            let maxVariance = 30 + difficultyRatio * 220;
            let nextY = currentY + (Math.random() - 0.5) * maxVariance;
            
            // Tendency to push back into bounds
            if (nextY < 150) nextY = 150 + Math.random() * 100;
            if (nextY > 550) nextY = 550 - Math.random() * 100;
            
            terrainPoints.push({ x: nextX, y: nextY });
            currentX = nextX;
            currentY = nextY;
          }
        }
      }

      function resetShip() {
        ship = {
          x: W * 0.5,
          y: 80,
          vx: 0,
          vy: 0,
          angle: 0,
          fuel: 100,
          landed: false,
          crashed: false
        };
        msgEl.textContent = '';
        gameOver = false;
      }

      function resetGame(keepScore) {
        GRAVITY = 0.01 + ((currentLevel - 1) * 0.0015); // gravity scales from 0.01 to ~0.0385
        createTerrain();
        if (!keepScore) {
          totalScore = 0;
          currentLevel = 1;
          GRAVITY = 0.01;
          createTerrain();
          gameStarted = false; // Reset to start screen on hard reset
        }
        resetShip();
        updateHUD();
      }

      function groundYAt(x) {
        // Clamp x into terrain range
        x = Math.max(0, Math.min(W, x));
        for (let i = 0; i < terrainPoints.length - 1; i++) {
          const p1 = terrainPoints[i];
          const p2 = terrainPoints[i + 1];
          if (x >= p1.x && x <= p2.x) {
            const t = (x - p1.x) / (p2.x - p1.x);
            return p1.y + (p2.y - p1.y) * t;
          }
        }
        // Fallback (should not hit)
        return H;
      }

      function getLandingPadAt(x) {
        for (const pad of landingPads) {
          if (x >= pad.startX && x <= pad.endX) {
            return pad;
          }
        }
        return null;
      }

      let lastTime = performance.now();

      function updatePhysics(dt) {
        if (!gameStarted || gameOver) return;

        const timeScale = dt / 16.666; // Normalize to 60 FPS

        if (keys.left) {
          ship.angle -= ROTATE_SPEED * timeScale;
        }
        if (keys.right) {
          ship.angle += ROTATE_SPEED * timeScale;
        }

        if (keys.thrust && ship.fuel > 0 && !ship.landed && !ship.crashed) {
          const ax = Math.sin(ship.angle) * THRUST * timeScale; // positive to push ship right when tilted right
          const ay = Math.cos(ship.angle) * -THRUST * timeScale; // negative because Y is inverted
          ship.vx += ax;
          ship.vy += ay;
          ship.fuel = Math.max(0, ship.fuel - 0.15 * timeScale);
        }

        ship.vy += GRAVITY * timeScale;

        ship.x += ship.vx * timeScale;
        ship.y += ship.vy * timeScale;

        // basic horizontal wrapping to keep ship on screen
        if (ship.x < 0) ship.x = 0;
        if (ship.x > W) ship.x = W;

        // Better collision detection: Check bottom-left, bottom-right corners and bottom center
        const cosA = Math.cos(ship.angle);
        const sinA = Math.sin(ship.angle);
        
        const hw = SHIP_WIDTH * 0.5;
        const hh = SHIP_HEIGHT * 0.5;
        
        // Relative unrotated positions of bottom corners
        const blX_rot = (-hw) * cosA - (hh) * sinA;
        const blY_rot = (-hw) * sinA + (hh) * cosA;
        
        const brX_rot = (hw) * cosA - (hh) * sinA;
        const brY_rot = (hw) * sinA + (hh) * cosA;

        // Absolute world positions
        const wBlX = ship.x + blX_rot;
        const wBlY = ship.y + blY_rot;
        
        const wBrX = ship.x + brX_rot;
        const wBrY = ship.y + brY_rot;
        
        const bottomY = ship.y + SHIP_HEIGHT * 0.5;

        // Sample terrain height at all 3 points
        const groundYBl = groundYAt(wBlX);
        const groundYBr = groundYAt(wBrX);
        const groundYCenter = groundYAt(ship.x);

        if (!ship.landed && !ship.crashed && (wBlY >= groundYBl || wBrY >= groundYBr || bottomY >= groundYCenter)) {
          handleLandingOrCrash();
        }
      }

      function handleLandingOrCrash() {
        const pad = getLandingPadAt(ship.x);
        const vSpeed = ship.vy;
        const hSpeed = ship.vx;
        const angleFromVertical = Math.abs(ship.angle);

        if (
          pad &&
          Math.abs(vSpeed) <= SAFE_VSPEED &&
          Math.abs(hSpeed) <= SAFE_HSPEED &&
          angleFromVertical <= SAFE_ANGLE
        ) {
          ship.landed = true;
          gameOver = true;
          const earned = pad.points;
          totalScore += earned;
          if (currentLevel < MAX_LEVEL) {
            msgEl.innerHTML = `Great landing! +${earned} points. <br/> Press <strong>N</strong> for Next Level.`;
          } else {
            msgEl.innerHTML = `YOU WIN! +${earned} points. <br/> You completed all ${MAX_LEVEL} levels! Score: ${totalScore}. Press R to restart game.`;
          }
        } else {
          ship.crashed = true;
          gameOver = true;
          msgEl.innerHTML = `CRASHED! Too hard, fast, or bad angle. <br/> Press <strong>R</strong> to retry Level ${currentLevel}.`;
        }
      }

      function drawBackground() {
        // Simple star field
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 80; i++) {
          const x = (i * 73) % W;
          const y = (i * 127) % (H * 0.7);
          ctx.fillRect(x, y, 1, 1);
        }
        ctx.restore();
      }

      function drawTerrain() {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(terrainPoints[0].x, terrainPoints[0].y);
        for (let i = 1; i < terrainPoints.length; i++) {
          ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y);
        }
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.closePath();

        const grd = ctx.createLinearGradient(0, H * 0.5, 0, H);
        grd.addColorStop(0, '#444');
        grd.addColorStop(1, '#111');
        ctx.fillStyle = grd;
        ctx.fill();

        // Draw outline
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#666';
        ctx.stroke();

        // Draw landing pads on top
        for (const pad of landingPads) {
          ctx.beginPath();
          ctx.moveTo(pad.startX, pad.y);
          ctx.lineTo(pad.endX, pad.y);
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#3cff9b';
          ctx.stroke();

          // Score label above pad
          ctx.fillStyle = '#ffd27f';
          ctx.font = '12px system-ui';
          const text = pad.label;
          const textWidth = ctx.measureText(text).width;
          ctx.fillText(text, pad.startX + (pad.endX - pad.startX) / 2 - textWidth / 2, pad.y - 8);
        }

        ctx.restore();
      }

      function drawShip() {
        if (ship.crashed) {
          ctx.save();
          ctx.translate(ship.x, ship.y);
          // Explosion effect
          ctx.beginPath();
          ctx.arc(0, 0, 20, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 100, 0, 0.8)';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 0, 10, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 200, 0, 0.9)';
          ctx.fill();
          ctx.restore();
          return;
        }

        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);

        // Body
        ctx.beginPath();
        ctx.moveTo(0, -SHIP_HEIGHT * 0.5); // top
        ctx.lineTo(-SHIP_WIDTH * 0.5, SHIP_HEIGHT * 0.5); // bottom left
        ctx.lineTo(SHIP_WIDTH * 0.5, SHIP_HEIGHT * 0.5); // bottom right
        ctx.closePath();
        ctx.fillStyle = '#e0e0e0';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#555';
        ctx.stroke();

        // Cabin
        ctx.beginPath();
        ctx.arc(0, -SHIP_HEIGHT * 0.25, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#7fd9ff';
        ctx.fill();

        // Legs
        ctx.beginPath();
        ctx.moveTo(-SHIP_WIDTH * 0.5, SHIP_HEIGHT * 0.5);
        ctx.lineTo(-SHIP_WIDTH * 0.8, SHIP_HEIGHT * 0.7);
        ctx.moveTo(SHIP_WIDTH * 0.5, SHIP_HEIGHT * 0.5);
        ctx.lineTo(SHIP_WIDTH * 0.8, SHIP_HEIGHT * 0.7);
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Thrust flame
        if (keys.thrust && ship.fuel > 0 && !ship.landed && !ship.crashed) {
          ctx.beginPath();
          ctx.moveTo(-5, SHIP_HEIGHT * 0.5);
          ctx.lineTo(0, SHIP_HEIGHT * 0.5 + 10 + Math.random() * 5);
          ctx.lineTo(5, SHIP_HEIGHT * 0.5);
          ctx.closePath();
          const grd = ctx.createLinearGradient(0, SHIP_HEIGHT * 0.5, 0, SHIP_HEIGHT * 0.5 + 16);
          grd.addColorStop(0, '#ffe66d');
          grd.addColorStop(1, '#ff2f00');
          ctx.fillStyle = grd;
          ctx.fill();
        }

        ctx.restore();
      }

      function updateHUD() {
        levelEl.textContent = currentLevel.toString();
        fuelEl.textContent = ship.fuel.toFixed(0);
        vSpeedEl.textContent = ship.vy.toFixed(2);
        hSpeedEl.textContent = ship.vx.toFixed(2);
        
        let degrees = (ship.angle * (180 / Math.PI)) % 360;
        if (degrees > 180) degrees -= 360;
        if (degrees < -180) degrees += 360;
        angleEl.textContent = degrees.toFixed(1) + '°';
        
        scoreEl.textContent = totalScore.toString();
      }

      function gameLoop(time) {
        if (!lastTime) lastTime = time;
        const dt = Math.min(time - lastTime, 100); // cap dt at 100ms to prevent huge jumps
        lastTime = time;

        updatePhysics(dt);
        drawBackground();
        drawTerrain();
        drawShip();
        updateHUD();
        
        if (!gameStarted) {
          ctx.save();
          ctx.fillStyle = '#ffcf77';
          ctx.font = '28px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText('PRESS S TO START', W / 2, H / 3);
          ctx.restore();
        }
        
        requestAnimationFrame(gameLoop);
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft') {
          keys.left = true;
        } else if (e.code === 'ArrowRight') {
          keys.right = true;
        } else if (e.code === 'ArrowUp') {
          keys.thrust = true;
        } else if (e.code === 'KeyS' && !gameStarted) {
          gameStarted = true;
          lastTime = performance.now(); // reset the timer so dt isn't massive
        } else if (e.code === 'KeyR') {
          if (gameOver && currentLevel === MAX_LEVEL && ship.landed) {
             resetGame(false); // completely restart game
          } else {
             resetGame(true); // restart current level keeping score
          }
        } else if (e.code === 'KeyN' && gameOver && ship.landed && currentLevel < MAX_LEVEL) {
          currentLevel++;
          resetGame(true); // next level keeping score
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft') {
          keys.left = false;
        } else if (e.code === 'ArrowRight') {
          keys.right = false;
        } else if (e.code === 'ArrowUp') {
          keys.thrust = false;
        }
      });

      // Initial boot
      resetGame(false);
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
