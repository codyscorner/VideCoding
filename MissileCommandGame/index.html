<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missile Command Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
            font-family: Arial, sans-serif;
        }
        #gameWrap {
            position: relative;
        }
        canvas {
            border: 2px solid white;
            background: black;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 24px;
        }
        #ammo {
            position: absolute;
            top: 40px;
            left: 10px;
            color: white;
            font-size: 24px;
        }
        #hint {
            position: absolute;
            top: 70px;
            left: 10px;
            color: #aaa;
            font-size: 14px;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 14px;
            text-align: right;
        }
        #controls label {
            display: block;
            margin-bottom: 6px;
        }
        #highscores {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border: 1px solid #444;
            min-width: 140px;
        }
        #highscores h3 {
            margin: 0 0 6px 0;
            font-size: 15px;
        }
        #highscores ol {
            margin: 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <div id="gameWrap">
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
        <div id="score">Score: 0</div>
        <div id="ammo">Ammo: 30</div>
        <div id="hint">Press P to pause</div>
        <div id="controls">
            <label>Difficulty:
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Hard</option>
                </select>
            </label>
            <label><input type="checkbox" id="soundToggle" checked> Sound Effects</label>
        </div>
        <div id="highscores">
            <h3>High Scores</h3>
            <ol id="highscoreList"></ol>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
